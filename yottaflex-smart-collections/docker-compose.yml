services:
  db:
    image: postgres:16
    container_name: yottaflex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collections_db
      POSTGRES_USER: collections_user
      POSTGRES_PASSWORD: collections_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collections_user -d collections_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
